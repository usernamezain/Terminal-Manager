name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest, ubuntu-latest]
        node-version: [20.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native dependencies (Windows only)
        if: runner.os == 'Windows'
        run: npm run rebuild

      - name: Documentation Integrity Check
        run: npm run docs:check

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Test Suite (Vitest)
        run: npx vitest run

      - name: Compile Production Bundles
        run: npm run build

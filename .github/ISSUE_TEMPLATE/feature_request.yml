name: 💡 Feature Request
description: Propose a new feature, integration, or enhancement for Terminal Manager
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate feature suggestions that align with our focus on speed, native ConPTY integration, and streamlined Windows developer workflows.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe it clearly.
      placeholder: I am always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or workflow you would like to see added.
      placeholder: Add support for...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches
      description: Describe any alternative solutions or workarounds you have considered.
    validations:
      required: false
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and feature requests to confirm this has not been proposed already.
          required: true
        - label: This suggestion adheres to non-destructive user settings and Windows desktop guidelines.
          required: true
